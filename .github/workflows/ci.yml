name: Проверка проекта

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Подготовить тестовую базу
        run: npm run setup

      - name: Запустить сервер для API-тестов
        run: |
          npm run dev > /tmp/monitor-server.log 2>&1 &
          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3000/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:3000/ > /dev/null

      - name: Проверить тесты
        run: npm test

      - name: Проверить production-сборку
        run: npm run build

      - name: Проверить зависимости
        run: npm audit --audit-level=high
