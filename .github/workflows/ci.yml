name: Проверка проекта

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Проверить тесты
        run: npm test

      - name: Проверить production-сборку
        run: npm run build

      - name: Проверить зависимости
        run: npm audit --audit-level=high
