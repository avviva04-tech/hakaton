name: Перевірка проєкту
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Отримати код
        uses: actions/checkout@v4
      - name: Встановити Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Встановити залежності
        run: npm ci
      - name: Підготувати застосунок
        run: npm run setup
      - name: Перевірити форматування
        run: npm run format:check
      - name: Перевірити збірку
        run: npm run build
      - name: Перевірити правила та API на тимчасовій базі
        run: npm test
      - name: Перевірити скидання демоданих
        run: npm run test:reset
      - name: Перевірити залежності
        run: npm audit --audit-level=high
